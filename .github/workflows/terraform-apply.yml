name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  plan:
    name: Create Plan for Approval
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2
          role-session-name: GitHubTerraformApplyPlan

      - name: Initialise Terraform
        working-directory: infra
        run: terraform init -input=false

      - name: Create saved plan
        working-directory: infra
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Display proposed changes
        working-directory: infra
        run: terraform show -no-color tfplan

      - name: Upload saved plan
        uses: actions/upload-artifact@v4
        with:
          name: apply-plan-${{ github.sha }}
          path: infra/tfplan
          retention-days: 1

  apply:
    name: Apply Approved Plan
    needs: plan
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2
          role-session-name: GitHubTerraformApply

      - name: Initialise Terraform
        working-directory: infra
        run: terraform init -input=false

      - name: Download reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: apply-plan-${{ github.sha }}
          path: infra

      - name: Apply the saved plan
        working-directory: infra
        run: terraform apply -input=false -no-color tfplan
